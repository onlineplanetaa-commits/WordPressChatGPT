name: WordPress draft from ChatGPT

on:
  issues:
    types: [opened, edited]

jobs:
  wordpress:
    if: startsWith(github.event.issue.title, '[WP]')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Install image conversion dependency
        run: python3 -m pip install --user Pillow

      - name: Create WordPress draft with WebP featured image
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, io, re, sys
          from PIL import Image

          wp_url = os.environ["WP_URL"].rstrip("/")
          wp_user = os.environ["WP_USER"]
          wp_password = os.environ["WP_APP_PASSWORD"]
          title = os.environ["ISSUE_TITLE"][4:].strip()
          content = os.environ.get("ISSUE_BODY") or ""
          auth = base64.b64encode(f"{wp_user}:{wp_password}".encode()).decode()
          headers = {
              "Authorization": "Basic " + auth,
              "User-Agent": "WorldGoneMadWordPressPublisher/1.0"
          }

          def request_json(url, data=None, extra_headers=None, method=None):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              req = urllib.request.Request(url, data=data, headers=h, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          # Find a reusable image on Wikimedia Commons and only accept freely
          # reusable licenses; convert it locally to WebP before uploading.
          search_terms = [title]
          clean = re.sub(r"[^A-Za-z0-9 ]", " ", title)
          words = [w for w in clean.split() if len(w) > 3]
          if len(words) > 5:
              search_terms.append(" ".join(words[:5]))

          chosen = None
          for term in search_terms:
              params = urllib.parse.urlencode({
                  "action": "query",
                  "format": "json",
                  "generator": "search",
                  "gsrsearch": term,
                  "gsrnamespace": 6,
                  "gsrlimit": 10,
                  "prop": "imageinfo",
                  "iiprop": "url|mime|extmetadata",
                  "iiurlwidth": 1600
              })
              api = "https://commons.wikimedia.org/w/api.php?" + params
              try:
                  commons_req = urllib.request.Request(api, headers={"User-Agent": "WorldGoneMadBot/1.0 (WordPress article publisher)"})
                  with urllib.request.urlopen(commons_req, timeout=45) as commons_response:
                      result = json.load(commons_response)
                  pages = (result.get("query") or {}).get("pages") or {}
                  for page in pages.values():
                      info = (page.get("imageinfo") or [{}])[0]
                      mime = info.get("mime", "")
                      meta = info.get("extmetadata") or {}
                      license_name = (meta.get("LicenseShortName") or {}).get("value", "")
                      license_url = (meta.get("LicenseUrl") or {}).get("value", "")
                      artist = (meta.get("Artist") or {}).get("value", "")
                      source_url = info.get("descriptionurl", "")
                      image_url = info.get("thumburl") or info.get("url")
                      if not image_url or mime not in ("image/jpeg", "image/png", "image/webp"):
                          continue
                      if not any(x in license_name.lower() for x in ("public domain", "cc0", "cc by")):
                          continue
                      if "nc" in license_name.lower() or "noncommercial" in license_name.lower():
                          continue
                      chosen = {
                          "url": image_url,
                          "source": source_url,
                          "license": license_name,
                          "license_url": license_url,
                          "artist": re.sub("<[^>]+>", "", artist)[:500]
                      }
                      break
                  if chosen:
                      break
              except Exception as e:
                  print("Commons search attempt failed:", str(e))

          if not chosen:
              print("ERROR: No suitable openly licensed Wikimedia Commons image found; refusing to create a draft without its required image.")
              sys.exit(1)

          image_req = urllib.request.Request(
              chosen["url"],
              headers={"User-Agent": "WorldGoneMadWordPressPublisher/1.0"}
          )
          with urllib.request.urlopen(image_req, timeout=60) as response:
              raw_image = response.read()

          image = Image.open(io.BytesIO(raw_image)).convert("RGB")
          image.thumbnail((1600, 1000), Image.Resampling.LANCZOS)
          output = io.BytesIO()
          image.save(output, format="WEBP", quality=84, method=6)
          webp = output.getvalue()

          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:65] or "article-image"
          filename = slug + ".webp"
          media_req = urllib.request.Request(
              wp_url + "/wp-json/wp/v2/media",
              data=webp,
              headers={
                  **headers,
                  "Content-Type": "image/webp",
                  "Content-Disposition": f'attachment; filename="{filename}"'
              },
              method="POST"
          )
          with urllib.request.urlopen(media_req, timeout=60) as response:
              media = json.load(response)

          alt_text = title[:250]
          attribution = (
              "Image source: Wikimedia Commons. "
              + (chosen["artist"] or "Contributor not specified")
              + ". License: " + chosen["license"]
              + ". Source: " + chosen["source"]
              + (". License details: " + chosen["license_url"] if chosen["license_url"] else "")
          )
          request_json(
              wp_url + "/wp-json/wp/v2/media/" + str(media["id"]),
              data=json.dumps({
                  "alt_text": alt_text,
                  "caption": attribution,
                  "description": attribution
              }).encode("utf-8"),
              extra_headers={"Content-Type": "application/json"},
              method="POST"
          )

          post_data = json.dumps({
              "title": title,
              "content": content,
              "status": "draft",
              "featured_media": media["id"]
          }).encode("utf-8")
          post = request_json(
              wp_url + "/wp-json/wp/v2/posts",
              data=post_data,
              extra_headers={"Content-Type": "application/json"},
              method="POST"
          )

          print("WebP featured image uploaded:", media.get("id"), filename, len(webp), "bytes")
          print("Image source:", chosen["source"])
          print("Image license:", chosen["license"])
          print("WordPress draft created:", post.get("id"))
          print("WordPress link:", post.get("link"))
          PY

      - name: Close processed issue
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -X PATCH -f state=closed -f state_reason=completed
